<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to bottom right, #5d62ff, #9f5aff);
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .mockup-card {
    background: white;
    width: 400px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  }

  .mockup-header {
    background: #457bff;
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 10px;
  }

  .mockup-header .circle {
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
    margin-right: 6px;
  }

  .mockup-body {
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mockup-body .avatar {
    width: 60px;
    height: 60px;
    background: #e0e0e0;
    border-radius: 50%;
  }

  .mockup-body .content-lines {
    flex: 1;
  }

  .line {
    height: 14px;
    background: #e0e0e0;
    border-radius: 4px;
    margin-bottom: 8px;
  }

  .line.short {
    width: 50%;
  }

  .mockup-post {
    height: 180px;
    background: #f5f5f5;
  }
    </style>
</head>
<body>

<div class="mockup-card">
  <div class="mockup-header">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>
  <div class="mockup-body">
    <div class="avatar"></div>
    <div class="content-lines">
      <div class="line"></div>
      <div class="line short"></div>
    </div>
  </div>
  <div class="mockup-post"></div>
</div>
</body>

<script>
 window.addEventListener('load', () => {
  const loader = document.querySelector('.mockup-card');

  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

  const isSlowConnection = () => {
    if (!connection || !connection.effectiveType) return false;

    // Define slow connection types
    const slowTypes = ['slow-2g', '2g', '3g', 'slow-4g'];
    return slowTypes.includes(connection.effectiveType);
  };

  // Show or hide loader based on network speed
  if (isSlowConnection()) {
    loader.style.display = 'block';
  } else {
    loader.style.display = 'block';
  }
});

// Optional fallback if page loads very slowly (e.g., stuck even with 4g label)
setTimeout(() => {
  const loader = document.querySelector('.lds-roller');
  if (document.readyState !== 'complete') {
    loader.style.display = 'block';
  }
}, 3000);


</script>

</html>
